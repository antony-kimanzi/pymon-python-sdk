[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pymon-sdk"
version = "0.1.5"
description = "Monitor your Python jobs with one decorator."
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
authors = [
    { name = "Antony Kimanzi", email = "antony.kim345@gmail.com"}
]
keywords = ["monitoring", "cron", "jobs", "celery", "alerts", "devops"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "requests>=2.28.0"
]

[project.urls]
Homepage = "https://pymon.dev"
Repository = "https://github.com/antony_kimanzi/pymon-python-sdk"